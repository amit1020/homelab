machine:
  nodeLabels:
    node-role.kubernetes.io/worker: ""
    topology.kubernetes.io/zone: worker-host
  kubelet:
    extraConfig:
      maxPods: 200
    extraMounts:
      - destination: /var/mnt/local-path
        type: bind
        source: /var/mnt/local-path
        options: [bind, rshared, rw]