apiVersion: v1alpha1
kind: KubeNodeConfig
nodeLabels:
  node-role.kubernetes.io/worker: ""
  topology.kubernetes.io/zone: worker-host
---
apiVersion: v1alpha1
kind: KubeletConfig
extraConfig:
  maxPods: 200
extraMounts:
  - destination: /var/mnt/local-path
    type: bind
    source: /var/mnt/local-path
    options:
      - bind
      - rshared
      - rw
---
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: talos-api
portSelector:
  ports:
    - 50000
  protocol: tcp
ingress:
  - subnet: 192.168.99.0/24
  - subnet: 10.10.10.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubelet
portSelector:
  ports:
    - 10250
  protocol: tcp
ingress:
  - subnet: 192.168.99.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: cilium-health
portSelector:
  ports:
    - 4240
  protocol: tcp
ingress:
  - subnet: 192.168.99.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: vxlan
portSelector:
  ports:
    - 8472
  protocol: udp
ingress:
  - subnet: 192.168.99.0/24