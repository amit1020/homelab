cluster:
  allowSchedulingOnControlPlanes: false
---
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: talos-api
portSelector:
  ports:
    - 50000
  protocol: tcp
ingress:
  - subnet: 192.168.99.0/24
  - subnet: 10.10.10.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kube-api
portSelector:
  ports:
    - 6443
  protocol: tcp
ingress:
  - subnet: 192.168.99.0/24
  - subnet: 10.10.10.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: etcd
portSelector:
  ports:
    - 2379
    - 2380
  protocol: tcp
ingress:
  - subnet: 192.168.99.21/32
  - subnet: 192.168.99.22/32
  - subnet: 192.168.99.23/32
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubelet
portSelector:
  ports:
    - 10250
  protocol: tcp
ingress:
  - subnet: 192.168.99.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: cilium-health
portSelector:
  ports:
    - 4240
  protocol: tcp
ingress:
  - subnet: 192.168.99.0/24
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: vxlan
portSelector:
  ports:
    - 8472
  protocol: udp
ingress:
  - subnet: 192.168.99.0/24