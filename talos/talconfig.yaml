clusterName: homelab
talosVersion: v1.14.0
kubernetesVersion: v1.37.0
endpoint:  https://192.168.99.9:6443




additionalApiServerCertSans:
  - 192.168.99.9
  - 127.0.0.1

additionalMachineCertSans:
  - 192.168.99.9
  #In the future(When I'll add dns) - I'll configure static record "k8s.lan" point to 192.168.99.9
  - k8s.lan
  - 127.0.0.1

cniConfig:
  name: none #Ciluim will created seperated


nodes:
  #CP1
  - hostname: cp-1
    ipAddress: 192.168.99.21
    controlPlane: true
    installDiskSelector:
      size: ">=50GB"
    networkInterfaces:
      - interface: eth0
        dhcp: true
        vip:
          ip: 192.168.99.9

  #CP2
  - hostname: cp-2
    ipAddress: 192.168.99.22
    controlPlane: true
    installDiskSelector:
      size: ">=50GB"
    networkInterfaces:
      - interface: eth0
        dhcp: true
        vip:
          ip: 192.168.99.9

  #CP3
  - hostname: cp-3
    ipAddress: 192.168.99.23
    controlPlane: true
    installDiskSelector:
      size: ">=50GB"
    networkInterfaces:
      - interface: eth0
        dhcp: true
        vip:
          ip: 192.168.99.9

  #Worker1
  - hostname: worker1
    ipAddress: 192.168.99.31
    controlPlane: false
    installDiskSelector:
      size: ">=100GB"

    #Worker2
  - hostname: worker2
    ipAddress: 192.168.99.32
    controlPlane: false
    installDiskSelector:
      size: ">=100GB"


patches:
  - "@./patches/common.yaml"





